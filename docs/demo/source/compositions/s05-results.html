<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #results-root { position: absolute; inset: 0; }
        #results-root .eyebrow { color: var(--c-eval); }
        #results-root .cards { position: absolute; left: 120px; top: 290px; width: 1680px; display: flex; gap: 30px; }
        #results-root .card {
          position: relative; flex: 1 1 0; height: 500px; border-radius: 16px; border: 2px solid var(--line);
          background: var(--panel); padding: 44px 34px 36px; display: flex; flex-direction: column; overflow: hidden;
        }
        #results-root .card .bar { position: absolute; left: 0; top: 0; width: 100%; height: 6px; }
        #results-root .card .layer { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
        #results-root .card .big {
          margin-top: 18px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 104px;
          font-weight: 700; letter-spacing: -0.05em; line-height: 1; white-space: nowrap;
        }
        #results-root .card .lab { margin-top: 22px; font-size: 32px; font-weight: 700; line-height: 1.2; color: var(--ink); }
        #results-root .mini { position: relative; margin-top: 26px; width: 100%; height: 12px; border-radius: 6px; background: rgba(178, 191, 204, 0.16); }
        #results-root .mini-fill { position: absolute; left: 0; top: 0; width: 100%; height: 12px; border-radius: 6px; transform-origin: left center; }
        #results-root .card .foot {
          margin-top: auto; padding-top: 18px; border-top: 2px solid var(--line);
          font-family: var(--mono); font-size: 22px; color: var(--ink-soft); white-space: nowrap;
        }
        #results-root .opt .bar, #results-root .opt .mini-fill { background: var(--c-opt); }
        #results-root .opt .big, #results-root .opt .layer { color: var(--c-opt); }
        #results-root .mod .bar, #results-root .mod .mini-fill { background: var(--c-model); }
        #results-root .mod .big, #results-root .mod .layer { color: var(--c-model); }
        #results-root .rsk .bar, #results-root .rsk .mini-fill { background: var(--c-risk); }
        #results-root .rsk .big, #results-root .rsk .layer { color: var(--c-risk); }
        #results-root .evl .bar, #results-root .evl .mini-fill { background: var(--c-eval); }
        #results-root .evl .big, #results-root .evl .layer { color: var(--c-eval); }
        #results-root .footnote { position: absolute; left: 120px; top: 840px; font-size: 26px; font-weight: 500; color: var(--ink-soft); }
      </style>
      <div id="results-root" data-composition-id="results" data-width="1920" data-height="1080">
        <div class="scene" id="results-in">
          <div class="eyebrow" data-layout-allow-overlap id="results-eyebrow">08 · Results · 20,000 doctors, held-out scores</div>
          <div class="scene-title" data-layout-allow-overlap id="results-title">More converters per call, and the network is why.</div>
          <div class="scene-sub" id="results-sub">AUC = how well a score ranks converters above the rest (0.5 = a coin flip); higher is better.</div>
          <div class="cards">
            <div class="card opt" id="results-c1"><div class="bar"></div><div class="layer">call plan</div>
              <div class="big">+<span id="results-v1">0</span>%</div><div class="lab">converters reached with 1,000 calls</div>
              <div class="mini"><div class="mini-fill" id="results-m1"></div></div><div class="foot">decile list 126 → 189</div></div>
            <div class="card mod" id="results-c2"><div class="bar"></div><div class="layer">model</div>
              <div class="big" id="results-v2">0.641</div><div class="lab">AUC with graph features</div>
              <div class="mini"><div class="mini-fill" id="results-m2"></div></div><div class="foot">range +0.018 to +0.037</div></div>
            <div class="card rsk" id="results-c3"><div class="bar"></div><div class="layer">shuffled control</div>
              <div class="big" id="results-v3">0.668</div><div class="lab">AUC when doctors are shuffled on the graph</div>
              <div class="mini"><div class="mini-fill" id="results-m3"></div></div><div class="foot">below no-network 0.641</div></div>
            <div class="card evl" id="results-c4"><div class="bar"></div><div class="layer">headroom</div>
              <div class="big"><span id="results-v4">0</span>%</div><div class="lab">of the gap to the best possible closed</div>
              <div class="mini"><div class="mini-fill" id="results-m4"></div></div><div class="foot">126 → 212, max 322</div></div>
          </div>
          <div class="footnote" id="results-foot">Graph features beat the no-network model on all 3 generated markets: +0.025 to +0.039 AUC · 95% ranges from 200 resamples</div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = 8.8;
          tl.fromTo("#results-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#results-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#results-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo("#results-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
          // values from outputs/ablation.csv; mini bars drawn to the same ratios
          const stats = [
            { v: "results-v1", m: "#results-m1", from: 0, to: 50, d: 0, r0: 126 / 189, r: 1 },
            { v: "results-v2", m: "#results-m2", from: 0.641, to: 0.668, d: 3, r0: 0.641 / 0.761, r: 0.668 / 0.761 },
            { v: "results-v3", m: "#results-m3", from: 0.668, to: 0.633, d: 3, r0: 0.668 / 0.761, r: 0.633 / 0.761 },
            { v: "results-v4", m: "#results-m4", from: 0, to: 44, d: 0, r0: 0, r: 0.44 },
          ];
          stats.forEach((s, i) => {
            const at = 0.7 + i * 0.16;
            tl.fromTo("#results-c" + (i + 1), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at);
            const o = { v: s.from };
            const el = document.getElementById(s.v);
            tl.to(o, { v: s.to, duration: 1.6, ease: "power3.out", onUpdate: () => { el.textContent = o.v.toFixed(s.d); } }, at + 0.3);
            tl.fromTo(s.m, { scaleX: s.r0 }, { scaleX: s.r, duration: 1.6, ease: "power3.out" }, at + 0.3);
          });
          tl.fromTo("#results-foot", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.8);
          tl.to("#results-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.8); // dip: fully out before the next scene starts
          window.__timelines["results"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
