          const calledEl = document.getElementById("va-called"), swEl = document.getElementById("va-sw");
          let nsw = 0;
          marks.forEach((m, k) => {
            const at = CALL0 + k * STEP;
            const card = el("rect", { x: -7, y: -9, width: 14, height: 18, rx: 3, fill: "#6d3cf0", opacity: 0 });
            tl.fromTo(card, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.05 }, at);
            tl.fromTo(card, { x: P.x + 31, y: P.y + 6 }, { x: m.x, y: m.y, duration: 0.55, ease: "power2.inOut" }, at);
            tl.to(card, { attr: { opacity: 0 }, duration: 0.08 }, at + 0.55);
            tl.fromTo(m.done, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.15 }, at + 0.55);
            tl.to(called, { v: k + 1, duration: 0.02, ease: "none", onUpdate: () => { calledEl.textContent = Math.round(called.v); } }, at + 0.55);
            if (m.conv) {
              nsw += 1;
              tl.to(sw, { v: nsw, duration: 0.02, ease: "none", onUpdate: () => { swEl.textContent = Math.round(sw.v); } }, at + 0.55);
            }
          });
          svg.appendChild(person);

          // ---------------- choreography ----------------
          tl.fromTo("#va-page", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.7, ease: "power3.inOut" }, 0);
          tl.fromTo("#va-edge", { x: 0, opacity: 1 }, { x: 1920, duration: 0.7, ease: "power3.inOut" }, 0);
          tl.to("#va-edge", { opacity: 0, duration: 0.1 }, 0.7);
          tl.fromTo("#va-kick", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);
          tl.fromTo("#va-ttl", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.55);
          tl.fromTo("#va-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.9);
          tl.fromTo("#va-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);
          tl.fromTo("#va-sheet", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
          SHEET.rows.forEach((_, i) => {
            tl.fromTo("#va-r" + i, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 1.3 + i * 0.3);
            tl.fromTo("#va-t" + i, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.3 + i * 0.3);
            tl.to("#va-t" + i, { opacity: 0, duration: 0.5 }, 1.6 + i * 0.3);
          });
          tl.fromTo("#va-more", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.3 + SHEET.rows.length * 0.3);
          tl.fromTo("#va-totals", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.6);
          tl.fromTo(["#va-dock", "#va-lab-dock", "#va-map", "#va-lab-map"], { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
          tl.fromTo("#va-person", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.1);
          tl.fromTo("#va-tally", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.4);
          tl.fromTo("#va-paper", { rotation: 0 }, { rotation: -10, svgOrigin: P.x + 31 + " " + (P.y + 6), duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 9 }, CALL0);
          tl.fromTo("#va-edges", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.8 }, 1.4);
          tl.fromTo("#va-nodes", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.6 }, 1.8);
          tl.fromTo("#va-planned", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.6 }, 3.0);
          tl.fromTo("#va-caption", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.8);
          // all text fades out before the wipe, so no two slides' text is ever on screen together
          tl.to(["#va-kick", "#va-ttl", "#va-ul", "#va-sub", "#va-sheet", "#va-lab-dock", "#va-dock", "#va-tally", "#va-map", "#va-lab-map", "#va-svg", "#va-caption"], { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 1.05);
          // wipe out (white -> dark), revealing the next dark scene underneath
          tl.to("#va-page", { clipPath: "inset(0px 0px 0px 100%)", duration: 0.7, ease: "power3.inOut" }, D - 0.7);
          tl.fromTo("#va-edge", { x: 0, opacity: 0 }, { x: 1920, opacity: 1, duration: 0.7, ease: "power3.inOut", immediateRender: false }, D - 0.7);
          window.__timelines["value"] = tl;
        })();
      </script>
    </template>
  </body>
