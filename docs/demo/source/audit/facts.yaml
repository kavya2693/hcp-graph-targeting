  import re as _re
  def abl(arm):
      return row('outputs/ablation.csv', arm=arm)
  def lad(arm):
      r = abl(arm)
      return '{} · {:.3f}'.format(int(r['captured_5pct']), r['auc'])
  def dl(arm, vs):
      r = row('outputs/deltas.csv', arm=arm, vs=vs, metric='auc')
      f = lambda v: ('+' if v >= 0 else '-') + '{:.3f}'.format(abs(v))
      return '{} [{}, {}]'.format(f(r['delta']), f(r['ci_low']), f(r['ci_high']))
  def sample_labels_match():
      """Every sampled node's converted flag and every community count equal data/hcps.csv."""
      y = R('data/hcps.csv').set_index('hcp_id')['converted']
      s = J('demo:assets/call_plan.json')['network_sample']
      if any(int(y[n[0]]) != n[2] for n in s['nodes']):
          return False
      for ci, c in enumerate(s['communities']):
          members = [n[0] for n in s['nodes'] if n[1] == ci]
          # a level-1 community can reach outside the regional block, so the panel may show fewer members
          if len(members) > c['size'] or int(y[members].sum()) > c['converted']:
              return False
      sc = J('demo:assets/call_plan.json')['scene']
      return all(int(y[n[0]]) == n[2] for n in sc['nodes'])
  def sheet_rows_match():
      """The SHEET block injected in value.html must equal the exported plan, and the plan its own labels."""
      html = T('demo:compositions/value.html')
      m = _re.search(r"const SHEET = (\{.*?\}); /\* SHEET:END", html, _re.S)
      sheet = json.loads(m.group(1))
      plan = {p['rank']: p for p in J('demo:assets/call_plan.json')['plan']}
      h = R('data/hcps.csv').set_index('hcp_id')
      for r in sheet['rows']:
          p = plan[r['rank']]
          if any(r[k] != p[k] for k in r):
              return False
          if h.at[r['hcp'], 'specialty'] != r['specialty'] or h.at[r['hcp'], 'region'] != r['region'] or int(h.at[r['hcp'], 'decile']) != r['decile']:
              return False
      return [r['rank'] for r in sheet['rows']] == [1, 2, 3, 4, 5, 6]
