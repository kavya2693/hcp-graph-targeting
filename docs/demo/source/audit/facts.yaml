# Audit facts for the hcp-graph-targeting demo video.
# Read by tools/build_audit_report.py (docs/demo/source/tools/).
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: hcp-graph-targeting
  title: "hcp-graph-targeting: demo video audit report"
  repo_url: https://github.com/kavya2693/hcp-graph-targeting
  repo_dir: ../../../..          # paths are relative to this file
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 88.0
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [xgboost, networkx, torch, torch_geometric, sklearn, pandas, numpy]
  regenerate:
    - "make run                                   # data/ + outputs/ablation.csv, deltas.csv, feature_importance.csv, summary.json"
    - "uv run python scripts/seed_sweep.py        # outputs/seed_sweep.csv/.txt (seeds 11, 23)"
    - ".venv/bin/python docs/demo/source/tools/export_call_plan.py docs/demo/source/assets/call_plan.json   # ~30 s; asserts AUC + captured match ablation.csv"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/call_plan.json docs/demo/source/compositions --rows 1,2,3,4,5,6"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/hcp-graph-targeting-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/hcp-graph-targeting-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {data_seed: 7, cv_folds: 5, louvain_seed: 7, xgboost_seed: 7, bootstrap_resamples: 200}
  run_time: "summary.json runtime_seconds = 12,278.9 s (3.4 h) for the captured make run on a shared machine; README reports 403 s for a full run on an idle 10-core laptop. The demo's export re-run of one arm took about 30 s."

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator (20,000 HCPs, 8 specialties, 12 regions, about 440 practice groups, 24 months of class prescriptions, 75,155 ties). Real HCP prescribing and claims data is proprietary and not used."
    source: "src/hcp_targeting/data.py:78-206 (generate, seed 7); scripts/generate_data.py; README 'The data'"
    all_figures: true
    edit: ["src/hcp_targeting/data.py", "scripts/generate_data.py"]
    rerun: ["make data", "make run", "export_call_plan.py + inject_sheet.py"]
  - id: A-02
    statement: "The generator decides how much the network matters: conversion depends on hidden practice-group culture (sd 0.75 log-odds) and exposure to advocate key opinion leaders (+1.3 log-odds at full exposure). The size of the graph lift is a property of the generator, not evidence about a real market."
    source: "src/hcp_targeting/data.py:96-98, :181-191; README 'Known limitations' (biggest gap)"
    figures: [F-13, F-29, F-30, F-32, F-33, F-34, F-35, F-36, F-37, F-38, F-39, F-43, F-46, F-47, F-48, F-49, F-50]
    edit: ["src/hcp_targeting/data.py:98, :188-189"]
    rerun: ["make run", "export_call_plan.py + inject_sheet.py"]
  - id: A-03
    statement: "A call budget is 5% (1,000 calls) or 20% (4,000 calls) of the 20,000 HCPs; 'converters reached' assumes the call is what converts the HCP (the model ranks propensity, not uplift from calling)."
    source: "src/hcp_targeting/cli.py:199-200 (--budget-small 0.05, --budget-large 0.20); evaluate.py:23-26 (captured_at_budget); README 'Known limitations'"
    figures: [F-05, F-22, F-32, F-33, F-34, F-35, F-36, F-37, F-38, F-39, F-41, F-42, F-43, F-44, F-45, F-46, F-49]
    edit: ["src/hcp_targeting/cli.py:199-200"]
    rerun: ["make run", "export_call_plan.py + inject_sheet.py"]
  - id: A-04
    statement: "Label-derived features (community and neighbour conversion rates) are rebuilt inside every outer fold from training labels only, with an inner 5-fold split and a prior weight of 20; embeddings are trained without labels."
    source: "src/hcp_targeting/features.py:153-184 (label_graph_features); evaluate.py:126-130; docs/adr/0001"
    figures: [F-10, F-11, F-12, F-13, F-27, F-35, F-40]
    edit: ["src/hcp_targeting/features.py:153-184", "src/hcp_targeting/evaluate.py:129 (prior_weight)"]
    rerun: ["make run", "export_call_plan.py + inject_sheet.py"]
  - id: A-05
    statement: "Louvain runs at resolution 1 (regional blocks) and 16 (practice-size communities); 16 was chosen to match practice size, not tuned on conversion."
    source: "src/hcp_targeting/features.py:60-76; README line 161"
    figures: [F-09, F-17, F-29, F-30, F-44]
    edit: ["src/hcp_targeting/features.py:60"]
    rerun: ["make run", "export_call_plan.py + inject_sheet.py"]
  - id: A-06
    statement: "Betweenness is estimated from 256 sampled sources (64 in the seed sweep)."
    source: "src/hcp_targeting/cli.py:198; features.py:89-91; scripts/seed_sweep.py:47"
    figures: [F-18, F-50]
    edit: ["src/hcp_targeting/cli.py:198"]
    rerun: ["make run"]
  - id: A-07
    statement: "Every arm uses one XGBoost setting (400 trees, depth 4, learning rate 0.03, seed 7) on the same 5 stratified folds; 7 arms plus 2 shuffled-graph controls = 45 fits."
    source: "src/hcp_targeting/evaluate.py:65-99, :143-144; cli.py:82-104"
    figures: [F-13, F-19, F-20, F-32, F-33, F-34, F-35, F-36, F-37, F-38, F-39, F-46, F-47, F-48]
    edit: ["src/hcp_targeting/evaluate.py:85-98"]
    rerun: ["make run", "export_call_plan.py + inject_sheet.py"]
  - id: A-08
    statement: "The shuffled-graph control moves every HCP to a random node of the same graph (seed 8 permutation): structure is unchanged, the person-position link is broken."
    source: "src/hcp_targeting/cli.py:93-104"
    figures: [F-11, F-38, F-48]
    edit: ["src/hcp_targeting/cli.py:93-104"]
    rerun: ["make run"]
  - id: A-09
    statement: "The ceiling row scores HCPs by the generator's true propensity (answer key), which no feature reads."
    source: "src/hcp_targeting/cli.py:106-107; data.py:42-43, :221-226"
    figures: [F-39, F-49]
    edit: ["src/hcp_targeting/data.py"]
    rerun: ["make run"]
  - id: A-10
    statement: "The call plan on slide 07 ranks the arm '+ community and neighbour conversion rates' (hand-built graph features, no embeddings) by its out-of-fold scores; the demo's export re-runs that arm and asserts AUC 0.668 and 189 / 126 converters captured match outputs/ablation.csv."
    source: "docs/demo/source/tools/export_call_plan.py"
    figures: [F-40, F-41, F-42, F-43, F-44, F-45]
    edit: ["docs/demo/source/tools/export_call_plan.py (arm, CALLS)"]
    rerun: ["export_call_plan.py + inject_sheet.py", "hyperframes render"]
  - id: A-11
    statement: "Video rounding: AUC to 3 decimals, AUC deltas to 3 decimals with sign, percentages to 1 decimal (community rates, 8.1%) or whole numbers (+50%, 44%, 61%, 40%, 21%, practice rate on slide 07), counts with thousands separators; '1 in 20' = 5% budget; '≈403 s' quotes the README."
    source: "this audit (display convention)"
    figures: [F-05, F-08, F-30, F-46, F-49, F-50, F-51, F-52, F-53, F-54, F-55, F-56]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-12
    statement: "Slide 01 (industry, everyday problems) is general pharma-commercial knowledge used as context, consistent with README 'The problem'. It carries no numbers and is not a repo result."
    source: "author's framing; README 'The problem'"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

