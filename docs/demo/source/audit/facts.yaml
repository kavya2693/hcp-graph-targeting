  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Who lives with this: pharma launch teams, field sales & commercial ops, specialty & device makers", shown: "3 industry chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (few calls, decile-ranked lists, loyal heavy writers, peer adoption)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem'", key: "README lines 11-26", formula: "-",
     check: {expr: "grep('README.md', r'fixed number of calls') and grep('README.md', r'prescription-volume deciles') and grep('README.md', r'entrenched on the incumbent') and grep('README.md', r'Doctors adopt when the people they share patients')", fmt: bool}}
