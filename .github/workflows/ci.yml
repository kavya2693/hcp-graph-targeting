name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # torch resolves to the CPU wheel index on Linux (see pyproject), so no CUDA download.
      - run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: types
        run: uv run mypy

      - name: tests
        run: uv run pytest -q

      # The full 20k-HCP run takes several minutes; CI proves the pipeline end to end on 3k.
      - name: end-to-end ablation, reduced scale
        run: uv run hcp-targeting --refresh --n-hcps 3000 --folds 3 --betweenness-k 64 --n-boot 50 --out ci-outputs
