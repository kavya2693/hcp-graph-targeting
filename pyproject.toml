[project]
name = "hcp-targeting"
version = "0.1.0"
description = "Which healthcare professionals a sales team should call when prescription-volume deciles stop separating converters from non-converters"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "networkx>=3.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.4,<2.11",  # 2.11+ ships macOS 14+ wheels only
    "torch-geometric>=2.6",
    "xgboost>=2.1",
]

[project.scripts]
hcp-targeting = "hcp_targeting.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcp_targeting"]

# Linux runners would otherwise pull the CUDA build of torch (several GB) for a CPU-only job.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# X and A follow the usual matrix notation for feature matrices and adjacency.
"src/hcp_targeting/*.py" = ["N803", "N806"]
"tests/*.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:torch.*"]
